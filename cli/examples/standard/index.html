<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Chroma standard app</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #1a1a18;
                --surface: #262624;
                --border: #3a3834;
                --text: #c3c0b6;
                --accent: #d97757;
                --accent-hover: #e8956f;
            }
            * { box-sizing: border-box; }
            body {
                font-family: system-ui, sans-serif;
                margin: 0;
                background: var(--bg);
                color: var(--text);
            }
            main { min-height: 100vh; padding: 2rem; max-width: 52rem; margin: 0 auto; }
            h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
            .subtitle { opacity: 0.7; margin-bottom: 1.5rem; font-size: 0.9rem; }
            section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
            h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin: 0 0 0.75rem; }
            label { display: block; font-size: 0.8rem; margin-bottom: 0.25rem; opacity: 0.8; }
            input, textarea, button {
                font: inherit;
                border-radius: 6px;
                border: 1px solid var(--border);
                background: var(--bg);
                color: var(--text);
            }
            input, textarea { width: 100%; padding: 0.5rem; margin-bottom: 0.5rem; }
            textarea { min-height: 5rem; resize: vertical; }
            button {
                padding: 0.45rem 0.9rem;
                cursor: pointer;
                background: var(--accent);
                border-color: var(--accent);
                color: #1a1a18;
                font-weight: 600;
            }
            button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
            button.secondary {
                background: transparent;
                color: var(--text);
                border-color: var(--border);
            }
            .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
            ul.file-list { list-style: none; padding: 0; margin: 0; }
            ul.file-list li {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.4rem 0;
                border-bottom: 1px solid var(--border);
            }
            ul.file-list li:last-child { border-bottom: none; }
            .kind { font-size: 0.7rem; opacity: 0.5; min-width: 2.5rem; }
            .path-btn {
                background: none;
                border: none;
                color: var(--accent);
                cursor: pointer;
                padding: 0;
                font-weight: 500;
            }
            .path-btn:hover { text-decoration: underline; }
            .preview {
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 0.75rem;
                font-family: ui-monospace, monospace;
                font-size: 0.85rem;
                white-space: pre-wrap;
                min-height: 3rem;
            }
            .status { font-size: 0.8rem; opacity: 0.7; margin-top: 0.5rem; }
            .error { color: #f87171; }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <!-- Standard template: dynamic ES modules + Chroma-Fs file explorer demo -->
        <script type="module" src="./src/main.chr"></script>
    </body>
</html>
